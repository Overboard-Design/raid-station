<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Playtests - NicheGaming</title>
<link rel="icon" type="image/x-icon" href="nichegaming favicon.jpg">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root { --main-color:#39ff14; }
*{box-sizing:border-box;margin:0;padding:0;}
body{
  font-family:"Orbitron",system-ui,sans-serif;
  background:#030303;
  color:var(--main-color);
  text-align:center;
  animation:crtFlicker 6s infinite;
  scroll-behavior:smooth;
}
@keyframes crtFlicker{0%{opacity:.98}5%{opacity:.95}10%{opacity:.98}15%{opacity:.94}20%{opacity:.98}100%{opacity:1}}
h1{
  margin:40px 0 20px 0;
  text-shadow:0 0 5px var(--main-color),0 0 10px var(--main-color),0 0 20px var(--main-color),0 0 40px var(--main-color);
}
#demo-list{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
  gap:20px;
  max-width:1200px;
  margin:20px auto 40px auto;
  padding:0 10px;
}
.game-card{
  background:#000;
  border:2px solid var(--main-color);
  padding:15px;
  border-radius:6px;
  box-shadow:0 0 10px var(--main-color),0 0 20px var(--main-color);
  transition:.3s, box-shadow 0.5s;
  cursor:pointer;
  position: relative;
}
.game-card:hover{
  transform:scale(1.05);
  box-shadow:0 0 20px var(--main-color),0 0 40px var(--main-color),0 0 60px var(--main-color);
}
.game-card h3{
  margin-bottom:10px;
  text-shadow:0 0 5px var(--main-color),0 0 10px var(--main-color);
}
a{
  color:var(--main-color);
  text-decoration:none;
  text-shadow:0 0 5px var(--main-color),0 0 10px var(--main-color);
}

.video-container{
  position:relative;
}
.video-container img{
  width:100%;
  border-radius:4px;
  display:block;
}
.play-button{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%, -50%);
  width:60px; height:60px;
  background:rgba(0,0,0,0.7);
  border-radius:50%;
  display:flex;
  justify-content:center;
  align-items:center;
  cursor:pointer;
  transition:0.3s;
}
.play-button::after{
  content:"";
  border-style:solid;
  border-width:15px 0 15px 25px;
  border-color:transparent transparent transparent var(--main-color);
  display:block;
  margin-left:5px;
}
.play-button:hover{
  background:rgba(0,0,0,0.9);
}

.spotlight{
  position: relative;
  height: 55vh;
  min-height: 300px;
  overflow: hidden;
  border-bottom: 2px solid var(--main-color);
  box-shadow: 0 0 20px var(--main-color);
}
.video-wrapper{
  position:absolute;
  top:0; left:0; width:100%; height:100%; overflow:hidden; z-index:1;
}
.video-wrapper iframe{
  position:absolute;
  top:50%; left:50%;
  width:177.78vh; height:100vh;
  min-width:100%; min-height:100%;
  transform:translate(-50%,-50%);
  pointer-events:none;
  filter:brightness(70%) contrast(120%);
  transition:filter 1s, opacity 1s;
  animation:spotlightPulse 6s infinite;
}
@keyframes spotlightPulse {
  0%,100%{ filter: brightness(70%) contrast(120%); }
  50%{ filter: brightness(85%) contrast(130%); }
}
.spotlight-overlay{
  position:relative; z-index:2; height:100%;
  display:flex; flex-direction:column;
  justify-content:center; align-items:center; text-align:center;
}
.spotlight-overlay h2{
  font-size:2rem;
  text-shadow:0 0 10px var(--main-color),0 0 20px var(--main-color),0 0 40px var(--main-color);
}
/* Buttons bottom-right in correct order */
.spotlight-overlay div {
  position: absolute;
  bottom:10px;
  right:10px;
  display:flex;
  gap:8px;
  flex-direction:row;
  transform:scale(0.625);
  transform-origin:bottom right;
}
.spotlight-btn{
  font-family: "Orbitron", system-ui, sans-serif;
  padding:14px 28px; /* match demo page */
  border:2px solid var(--main-color);
  background:#000;
  color:var(--main-color);
  text-decoration:none;
  border-radius:6px;
  transition:0.3s;
}

#top-bar{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:10px;
  margin:20px 0;
  flex-wrap:wrap;
}
#return-home,
#search-bar{
  padding:10px 14px;
  border:2px solid var(--main-color);
  border-radius:6px;
  background:#000;
  color:var(--main-color);
  box-sizing:border-box;
  font-family:"Orbitron", sans-serif;
  font-size:0.9rem;
}

#search-bar{
  width:300px;        
  max-width:90%;
}

#return-home{
  text-decoration:none;
  white-space:nowrap;
  display:flex;               
  align-items:center;         
}


/* BACK TO TOP */
#back-top {
   margin: 10px 0;              /* tighter spacing */
  padding: 5px 10px;           /* slightly smaller */
  font-size: 0.8rem;           /* cleaner scale */
  border: 1px solid var(--main-color);  /* thinner = sharper */
  background:#000;
  color:var(--main-color);
  display:inline-block;
  border-radius:4px;           /* tighter corners */
  text-decoration:none;
  transition: all 0.25s ease;
}

/* CRT GRID */
body::before{
  content:"";
  position:fixed;
  top:0;
  left:0;
  width:100vw;
  height:100vh;
  background:repeating-linear-gradient(
    to bottom,
    rgba(255,255,255,0.03) 0px,
    rgba(255,255,255,0.03) 1px,
    transparent 2px,
    transparent 4px
  );
  pointer-events:none;
  z-index:9999;
}
/* ========================= */
/* FINAL UNIVERSAL HOVER FIX */
/* ========================= */

button:hover,
a:hover,
#return-home:hover,
#back-top:hover,
.spotlight-btn:hover,
.menu-item:hover,
#filter-bar select:hover,
.filter-group button:hover {

  /* 🔴 kill all green fill everywhere */
  background: #000 !important;

  /* 🔴 force neon text */
  color: var(--main-color) !important;

  /* 🔥 strong glow */
  text-shadow:
    0 0 5px var(--main-color),
    0 0 10px var(--main-color),
    0 0 20px var(--main-color),
    0 0 40px var(--main-color),
    0 0 80px var(--main-color) !important;

  /* optional but nice */
  box-shadow:
    0 0 10px var(--main-color),
    0 0 20px var(--main-color);
}
/* DISCLAIMER */
.affiliate-disclaimer{
  max-width:1000px;
  margin:40px auto 80px;
  font-size:0.85rem;
  opacity:0.7;
  line-height:1.5;
}
/* =========================
   DISABLE SYSTEM CURSOR
========================= */

html, body {
  cursor: none !important;
}

*, *::before, *::after {
  cursor: none !important;
}

/* =========================
   CRT CURSOR CORE
========================= */

#crt-cursor {
  position: fixed;
  width: 10px;
  height: 10px;
  border-radius: 50%;
  pointer-events: none;
  z-index: 999999;

  background: var(--main-color);

  box-shadow:
    0 0 6px var(--main-color),
    0 0 12px var(--main-color),
    0 0 24px var(--main-color);
}


/* outer pulse ring */
#crt-cursor::after{
  content: "";
  position: absolute;
  top: 50%;
  left: 50%;
  width: 30px;
  height: 30px;
  transform: translate(-50%, -50%);
  border: 1px solid var(--main-color);
  border-radius: 50%;
  opacity: 0.5;
  animation: ringPulse 1.2s ease-in-out infinite;
}

/* =========================
   CURSOR PULSE (core glow breathing)
========================= */

@keyframes cursorPulse {
  0% {
    box-shadow:
      0 0 4px var(--main-color),
      0 0 10px var(--main-color),
      0 0 20px var(--main-color);
    transform: translate(-50%, -50%) scale(1);
  }
  50% {
    box-shadow:
      0 0 8px var(--main-color),
      0 0 18px var(--main-color),
      0 0 40px var(--main-color);
    transform: translate(-50%, -50%) scale(1.25);
  }
  100% {
    box-shadow:
      0 0 4px var(--main-color),
      0 0 10px var(--main-color),
      0 0 20px var(--main-color);
    transform: translate(-50%, -50%) scale(1);
  }
}

/* =========================
   OUTER SCAN RING
========================= */

@keyframes ringPulse {
  0% {
    opacity: 0.6;
    transform: translate(-50%, -50%) scale(0.8);
  }
  50% {
    opacity: 0.2;
    transform: translate(-50%, -50%) scale(1.4);
  }
  100% {
    opacity: 0;
    transform: translate(-50%, -50%) scale(1.8);
  }
}
#crt-ripple{
  position: fixed;
  width: 10px;
  height: 10px;
  border: 2px solid var(--main-color);
  border-radius: 50%;
  pointer-events: none;
  opacity: 0;
  z-index: 999998;
  transform: translate(-50%, -50%);
}
</style>
</head>
<body>
<div id="crt-cursor"></div>
<div id="crt-ripple"></div>
<section class="spotlight">
  <div class="video-wrapper">
    <div id="spotlight-video"></div>
  </div>
  <div class="spotlight-overlay">
    <h2 id="spotlight-title">Featured Playtest</h2> 
    <div>
      <a id="spotlight-link" class="spotlight-btn">Request Access</a>
      <a id="spotlight-skip" class="spotlight-btn">Skip</a>
      <a id="spotlight-unmute" class="spotlight-btn">Unmute</a>
    </div>
  </div>
</section>

<h1>Playtests</h1>
<div id="top-bar">
  <input type="text" id="search-bar" placeholder="Search Playtests...">
  <a href="index.html" id="return-home">Return Home</a>
</div>
<div id="demo-list"></div>
<!-- DISCLAIMER -->
<div class="affiliate-disclaimer">
Affiliate Disclaimer: Some links on this page may be affiliate links. We may earn a small commission at no extra cost to you.
</div>
<!-- Back to Top Button -->
<a href="#" id="back-top">Back to Top</a>

<script src="https://www.youtube.com/iframe_api"></script>
<script>
// Persisted color from index
const storedColor = localStorage.getItem("nicheColor");
if(storedColor){
  document.documentElement.style.setProperty("--main-color", storedColor);
  document.querySelectorAll("h1, .game-card, a, #return-home, #search-bar, #back-to-top").forEach(el=>{
    el.style.color = storedColor;
    el.style.borderColor = storedColor;
    el.style.textShadow = `0 0 5px ${storedColor},0 0 10px ${storedColor},0 0 20px ${storedColor}`;
  });
}

// Demo data
const demos = [
{ name:"Friendly Steps", appid:"4279630", youtubeId:"6GnBj_jSu1c" },
  { name:"Trainfort", appid:"2593980", youtubeId:"IFbgzp9coVc" },
  { name:"ORMOD: Directive", appid:"3424730", youtubeId:"RxqX6yzkkGE" },
  { name:"ENTRY_13", appid:"3930910", youtubeId:"wfjvI8Lm80g" },
  { name:"Cleaner Company", appid:"3644020", youtubeId:"iONvT6V-JCM" },
  { name:"Cyber Rail", appid:"2468230", youtubeId:"yMu6myReNNA" },
  { name:"Static Dread: The Submarine", appid:"4042160", youtubeId:"6UnDeL9UrHA" },
  { name:"Nomad: Steppeborn Saga", appid:"2564480", youtubeId:"hQk0BCq71tI" },
  { name:"Rescue Ops: Wildfire", appid:"2915770", youtubeId:"8E4LHkHcjgs" },
  { name:"CactusBandido", appid:"3330290", youtubeId:"BHJEMZdDJDo" },
  { name:"Rockhounds", appid:"3563060", youtubeId:"LTZPm-2ceNE" },
  { name:"Evade The Light", appid:"1601870", youtubeId:"hBh_zaGMM2Y" },
  { name:"Venison County", appid:"3868900", youtubeId:"mbhnXCKGuBg" },
  { name:"Gang of Frogs", appid:"3081510", youtubeId:"ve9qzH7jn_A" },
  { name:"Triarchy", appid:"2708040", youtubeId:"jktHoTDguW8" },
  { name:"Outward 2", appid:"2849490", youtubeId:"PKSH4d-iN-k" },
  { name:"Blackroot: Medieval Survival", appid:"2241550", youtubeId:"wmDChiLjqYs" },
  { name:"Shadow Of The Union", appid:"3574810", youtubeId:"8bVs_L6FPBM" },
  { name:"Myth of Valderit", appid:"3976610", youtubeId:"hQdp7DHbe4I" },
  { name:"Cranked", appid:"3989790", youtubeId:"2LsZoRIHYXY" },
  { name:"Ardem", appid:"2179480", youtubeId:"cDzAqcROkpI" },
  { name:"Enfant", appid:"4025390", youtubeId:"vN7bpdIHl6s" },
  { name:"WILDERLOCKE", appid:"3512280", youtubeId:"1mCLdXWlK2g" },
  { name:"Steel Effigy", appid:"2903980", youtubeId:"C0rIJn2xZ8k" },
];

// Spotlight - YouTube API
let spotlightPlayer;

// Get DOM references
const spotlightTitle = document.getElementById("spotlight-title");
const spotlightLink = document.getElementById("spotlight-link");
const spotlightSkip = document.getElementById("spotlight-skip");
const spotlightUnmute = document.getElementById("spotlight-unmute");

// Pick a random demo
function getRandomDemo() {
  return demos[Math.floor(Math.random() * demos.length)];
}

// Load a demo into the spotlight
function loadSpotlight(demo) {
  // Update title and link
  spotlightTitle.textContent = demo.name;
  spotlightLink.href = `https://store.steampowered.com/app/${demo.appid}`;

  // Load video
  if (spotlightPlayer) {
    spotlightPlayer.loadVideoById(demo.youtubeId);
  } else {
    spotlightPlayer = new YT.Player('spotlight-video', {
      videoId: demo.youtubeId,
      playerVars: {
        autoplay: 1,
        controls: 0,
        mute: 1,
        loop: 1,
        playlist: demo.youtubeId
      },
      events: { 'onStateChange': onSpotlightStateChange }
    });
  }

  // Reset unmute button text
  spotlightUnmute.textContent = "Unmute";
}

// Auto-play next demo when current ends
function onSpotlightStateChange(event) {
  if (event.data === YT.PlayerState.ENDED) {
    loadSpotlight(getRandomDemo());
  }
}

// Called by YouTube API once ready
function onYouTubeIframeAPIReady() {
  loadSpotlight(getRandomDemo());
}

// Skip button
spotlightSkip.addEventListener("click", () => {
  loadSpotlight(getRandomDemo());
});

// Toggle mute/unmute
spotlightUnmute.addEventListener("click", () => {
  if (!spotlightPlayer) return;
  if (spotlightPlayer.isMuted()) {
    spotlightPlayer.unMute();
    spotlightUnmute.textContent = "Mute";
  } else {
    spotlightPlayer.mute();
    spotlightUnmute.textContent = "Unmute";
  }
});

// Demo list
const container=document.getElementById("demo-list");
function displayDemos(list){
  container.innerHTML="";
  list.forEach(game=>{
    const card=document.createElement("div");
    card.className="game-card";
    const thumb=`https://img.youtube.com/vi/${game.youtubeId}/hqdefault.jpg`;
    card.innerHTML=`
      <h3>${game.name}</h3>
      <a href="https://store.steampowered.com/app/${game.appid}" target="_blank">Request Access</a>
      <div class="video-container">
        <img src="${thumb}" alt="${game.name} Thumbnail" data-video="${game.youtubeId}">
        <div class="play-button"></div>
      </div>
    `;
    container.appendChild(card);
  });
  document.querySelectorAll(".video-container img, .video-container .play-button").forEach(el=>{
    el.addEventListener("click",()=>{
      const containerDiv=el.closest(".video-container");
      const vidId=containerDiv.querySelector("img").dataset.video;
      const iframe=document.createElement("iframe");
      iframe.src=`https://www.youtube.com/embed/${vidId}?autoplay=1`;
      iframe.frameBorder="0";
      iframe.allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture";
      iframe.allowFullscreen=true;
      iframe.style.width="100%";
      iframe.style.height="200px";
      containerDiv.innerHTML="";
      containerDiv.appendChild(iframe);
    });
  });
}
displayDemos(demos);

// Search filter
const searchBar=document.getElementById("search-bar");
searchBar.addEventListener("input",e=>{
  const term=e.target.value.toLowerCase();
  displayDemos(demos.filter(d=>d.name.toLowerCase().includes(term)));
});

// Back to top
document.getElementById("back-top").onclick = (e)=>{
  e.preventDefault(); // prevent jump
  window.scrollTo({top:0, behavior:"smooth"});
};
if (storedColor) {
  const btn = document.getElementById("back-top");

  btn.style.borderColor = storedColor;
  btn.style.color = storedColor;

  btn.onmouseover = () => {
    btn.style.background = storedColor;
    btn.style.color = "#000";
  };

  btn.onmouseout = () => {
    btn.style.background = "#000";
    btn.style.color = storedColor;
  };
}
window.addEventListener("DOMContentLoaded", () => {

  const cursor = document.getElementById("crt-cursor");
  if (!cursor) return;

  let mouseX = 0;
  let mouseY = 0;

  let x = 0;
  let y = 0;

  document.addEventListener("mousemove", (e) => {
    mouseX = e.clientX;
    mouseY = e.clientY;
  });

  function animate() {
    x += (mouseX - x) * 0.18;
    y += (mouseY - y) * 0.18;

    cursor.style.left = x + "px";
    cursor.style.top = y + "px";

    requestAnimationFrame(animate);
  }

  animate();
});

</script>

</body>
</html>
